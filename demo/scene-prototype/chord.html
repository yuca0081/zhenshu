<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="assets/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070F; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    #cv { position: absolute; inset: 0; }
    #t-idx { position: absolute; right: 2.8%; top: 3.8%; color: #FBBE00; font-size: 23px;
      font-variant-numeric: tabular-nums; font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div id="t-idx">t=0.000s ×2.000</div>
  </div>
  <script>
    // ── scene 原型闸：乘法表弦图 ×2→×3 连续演变（无状态纯函数，t→画面）──
    // 验证三点：① GSAP 占位 tween onUpdate 在 seek 时必触发（canvas 有画面即证）
    // ② 同 t 同像素（确定性回放 diff=0）③ 加色混合辉光可行（globalCompositeOperation）
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    var W = 1920, H = 1080;
    var ctx = document.getElementById('cv').getContext('2d');
    var tIdx = document.getElementById('t-idx');

    // __draw(t, ctx, W, H, rng)：同 t 必须同像素——随机性只用注入的 seeded rng。
    window.__draw = function (t, ctx, W, H, rng) {
      var dur = 6.0;
      var p = Math.max(0, Math.min(1, t / dur));          // 段内进度
      var k = 2 + p;                                      // ×2 → ×3 连续演变
      var N = Math.max(24, Math.round(36 + 264 * Math.min(1, p * 1.6))); // 弦数生长
      var cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.40;
      var rot = 0.15 * p;                                 // 缓慢旋转
      // 深空底：种子星尘（rng 每帧从同一种子重置 → 确定性）
      for (var s = 0; s < 90; s++) {
        var sx = rng() * W, sy = rng() * H, sr = 0.6 + rng() * 1.8;
        ctx.fillStyle = 'rgba(230,238,255,' + (0.25 + rng() * 0.5).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.2832); ctx.fill();
      }
      // 外环
      ctx.strokeStyle = 'rgba(251,190,0,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
      // 弦图：点 i 连到角度 i*k（加色混合 = 霓虹辉光）
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < N; i++) {
        var a0 = (i / N) * 6.2832 + rot;
        var a1 = (i / N) * k * 6.2832 + rot;
        var hue = Math.round((i / N) * 300);
        ctx.strokeStyle = 'hsla(' + hue + ',95%,62%,.50)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(cx + R * Math.cos(a0), cy + R * Math.sin(a0));
        ctx.lineTo(cx + R * Math.cos(a1), cy + R * Math.sin(a1));
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      // 节点微光
      for (var j = 0; j < N; j += Math.max(1, Math.round(N / 24))) {
        var aj = (j / N) * 6.2832 + rot;
        ctx.fillStyle = 'rgba(255,244,214,.9)';
        ctx.beginPath(); ctx.arc(cx + R * Math.cos(aj), cy + R * Math.sin(aj), 2.6, 0, 6.2832); ctx.fill();
      }
    };

    // 驱动：占位 tween（与未来 kind=scene 契约同机制），onUpdate 取 tl.time() 调 __draw。
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    tl.to({}, {
      duration: 6, ease: 'none',
      onUpdate: function () {
        var t = tl.time();
        ctx.clearRect(0, 0, W, H);
        window.__draw(t, ctx, W, H, mulberry32(42));
        tIdx.textContent = 't=' + t.toFixed(3) + 's ×' + (2 + Math.max(0, Math.min(1, t / 6))).toFixed(3);
      }
    }, 0);
    window.__timelines['main'] = tl;
  </script>
</body>
</html>
