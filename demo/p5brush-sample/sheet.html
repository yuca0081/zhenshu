<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>画风矩阵总览</title>
<style>
  html,body{margin:0;padding:0;background:#f4f1e9;font-family:"Microsoft YaHei",sans-serif}
  .wrap{width:1940px;padding:0}
  .head{height:88px;display:flex;align-items:center;justify-content:center;gap:28px}
  .head h1{font-size:34px;color:#2c2c2c;margin:0}
  .head span{font-size:20px;color:#8a8574}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 16px}
  .cell{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .cell img{display:block;width:940px;height:1058px;object-fit:cover}
  .cell .cap{padding:10px 16px;font-size:22px;color:#2c2c2c;display:flex;justify-content:space-between}
  .cell .cap b{font-size:23px}
  .cell .cap i{font-style:normal;color:#8a8574;font-size:19px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>同一套几何 × 四套画材包</h1>
    <span>p5.brush 2.2.3 · 每张一颗种子 · 重跑逐像素一致</span>
  </div>
  <div class="grid">
    <div class="cell"><img src="style-vg.png"><div class="cap"><b>梵高 · 星夜厚涂</b><i>漩涡流场 + 短笔触 + 水彩月</i></div></div>
    <div class="cell"><img src="style-ink.png"><div class="cap"><b>北宋水墨 · 雨点皴</b><i>墨阶浓淡 + 皴点 + 留白云 + 朱印</i></div></div>
    <div class="cell"><img src="style-ukyo.png"><div class="cap"><b>浮世绘 · 平涂粗线</b><i>色块平涂 + 粗描边 + 雪顶富士</i></div></div>
    <div class="cell"><img src="style-etch.png"><div class="cap"><b>铜版蚀刻 · 排线</b><i>疏密排线 + 放射刻线 + 双钩</i></div></div>
  </div>
</div>
</body>
</html>
