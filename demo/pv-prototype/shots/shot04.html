<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;
  background:#140420;font-family:'Microsoft YaHei',sans-serif;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;}

.wrap{position:absolute;left:-30%;top:-20%;width:180%;height:150%;
  transform-origin:0 0;}
.stripe{position:absolute;left:0;width:100%;height:130px;border-radius:8px;}
</style></head><body><div id="stage"><div class="wrap" id="wrap"><div class="stripe" id="s0" style="top:-260px;background:#ff2d78"></div><div class="stripe" id="s1" style="top:40px;background:#ffb300"></div><div class="stripe" id="s2" style="top:340px;background:#00e5ff"></div><div class="stripe" id="s3" style="top:640px;background:#ff2d78"></div><div class="stripe" id="s4" style="top:940px;background:#ffb300"></div><div class="stripe" id="s5" style="top:1240px;background:#00e5ff"></div><div class="stripe" id="s6" style="top:1540px;background:#ff2d78"></div></div></div>
<script>
window.__READY = 1;
var BEAT = 0.5, BAR = 2.0, DUR = 4.0;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function eoc(x) { return 1 - Math.pow(1 - x, 3); }   // easeOutCubic
window.__renderFrame = function (t) {

  var pos = Math.floor(t / BEAT), frac = clamp((t % BEAT) / 0.12, 0, 1);
  document.getElementById('wrap').style.transform = 'rotate(-18deg) translateX('
    + (-(pos + eoc(frac)) * 150) + 'px)';                    // 逐拍步进吸附
  for (var i = 0; i < 7; i++) {
    document.getElementById('s' + i).style.opacity =
      ((pos + i) % 2 === 0) ? '0.95' : '0.4';                // 明暗按拍交替
  }

};
</script></body></html>
