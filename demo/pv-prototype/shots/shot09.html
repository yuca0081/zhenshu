<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;
  background:#140420;font-family:'Microsoft YaHei',sans-serif;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;}

.stack{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;}
.w{font-size:300px;font-weight:900;line-height:1.1;opacity:0.16;
  transition:none;}
</style></head><body><div id="stage"><div class="stack"><div class="w" id="w0"></div><div class="w" id="w1"></div><div class="w" id="w2"></div><div class="w" id="w3"></div></div></div>
<script>
window.__READY = 1;
var BEAT = 0.5, BAR = 2.0, DUR = 4.0;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function eoc(x) { return 1 - Math.pow(1 - x, 3); }   // easeOutCubic
window.__renderFrame = function (t) {

  var step = BAR / 2;                                        // 每半小节点亮一字：
  var idx = Math.min(3, Math.floor(t / step));               // 四字×1s 恰好收满镜头，
  var sp = (t % step) / step;                                // 末帧四字全亮（按小节
  var words = ["再", "闪", "一", "次"];                                     // 点亮会漏后两字的账错）
  for (var i = 0; i < 4; i++) {
    var el = document.getElementById('w' + i);
    el.textContent = words[i];
    if (i < idx) { el.style.opacity = '0.95';
      el.style.transform = 'scale(1)'; el.style.color = '#ffffff'; }
    else if (i === idx) {                                    // 点亮的字带弹入
      el.style.opacity = '1';
      el.style.transform = 'scale(' + (1 + 0.15 * Math.max(0, 1 - sp * 4)) + ')';
      el.style.color = '#ffffff';
      el.style.textShadow = '0 0 60px #ff2d78';
    } else { el.style.opacity = '0.16'; el.style.transform = 'scale(1)';
      el.style.color = '#00e5ff'; el.style.textShadow = 'none'; }
  }

};
</script></body></html>
