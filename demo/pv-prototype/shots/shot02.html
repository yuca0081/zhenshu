<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;
  background:#140420;font-family:'Microsoft YaHei',sans-serif;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;}

.bar{position:absolute;left:0;width:100%;height:96px;border-radius:10px;
  transform:translateX(-110%);}
</style></head><body><div id="stage"><div class="bar" id="b0" style="top:330px"></div><div class="bar" id="b1" style="top:540px"></div><div class="bar" id="b2" style="top:750px"></div><div class="bar" id="b3" style="top:960px"></div><div class="bar" id="b4" style="top:1170px"></div><div class="bar" id="b5" style="top:1380px"></div></div>
<script>
window.__READY = 1;
var BEAT = 0.5, BAR = 2.0, DUR = 4.0;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function eoc(x) { return 1 - Math.pow(1 - x, 3); }   // easeOutCubic
window.__renderFrame = function (t) {

  var idx = Math.floor(t / BEAT), bp = (t % BEAT) / BEAT;
  var cols = ['#ffb300', '#ff2d78', '#00e5ff'];
  for (var i = 0; i < 6; i++) {
    var el = document.getElementById('b' + i);
    var enter = eoc(clamp((t - i * BEAT) / 0.45, 0, 1));  // 一拍一条入场
    el.style.transform = 'translateX(' + (-110 * (1 - enter)) + '%) scaleY('
      + (1 + 0.08 * ((idx % 6 === i) ? Math.max(0, 1 - bp * 4) : 0)) + ')';
    el.style.background = cols[i % 3];
    el.style.opacity = String(0.35 + 0.65 * enter);
  }

};
</script></body></html>
