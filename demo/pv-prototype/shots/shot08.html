<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;
  background:#140420;font-family:'Microsoft YaHei',sans-serif;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;}

.ering{position:absolute;left:50%;top:50%;width:860px;height:1280px;
  margin:-640px 0 0 -430px;border-radius:50%;border:3px solid #00e5ff;
  opacity:0.35;}
.ob{position:absolute;left:0;top:0;width:84px;height:84px;border-radius:50%;}
</style></head><body><div id="stage"><div class="ering" id="ering"></div><div class="ob" id="ob0" style="background:#ff2d78;box-shadow:0 0 50px #ff2d78"></div><div class="ob" id="ob1" style="background:#ffb300;box-shadow:0 0 50px #ffb300"></div><div class="ob" id="ob2" style="background:#00e5ff;box-shadow:0 0 50px #00e5ff"></div><div class="ob" id="ob3" style="background:#ffffff;box-shadow:0 0 50px #ffffff"></div></div>
<script>
window.__READY = 1;
var BEAT = 0.5, BAR = 2.0, DUR = 4.0;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function eoc(x) { return 1 - Math.pow(1 - x, 3); }   // easeOutCubic
window.__renderFrame = function (t) {

  var pos = Math.floor(t / BEAT), frac = clamp((t % BEAT) / 0.14, 0, 1);
  var bpb = (t % BAR) / BAR;
  var ang = (pos + eoc(frac)) * Math.PI / 2;                 // 角度吸附到拍
  for (var i = 0; i < 4; i++) {
    var a = ang + i * Math.PI / 2;
    var x = 540 + 430 * Math.cos(a), y = 960 + 640 * Math.sin(a);
    document.getElementById('ob' + i).style.transform =
      'translate(' + (x - 42) + 'px,' + (y - 42) + 'px)';
  }
  document.getElementById('ering').style.transform =
    'scale(' + (1 + 0.05 * Math.max(0, 1 - bpb * 4)) + ')';  // 重拍环脉冲

};
</script></body></html>
