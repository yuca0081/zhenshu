<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>3D 渲染原型 · three.js soft</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F4D9E6; }
  #gl { width: 1920px; height: 1080px; display: block; }
  #cap { position: absolute; left: 56px; bottom: 40px; padding: 10px 28px; border-radius: 26px;
         background: rgba(255,255,255,0.75); color: #B0558A; font: 600 24px "Microsoft YaHei", sans-serif;
         opacity: 0; }
  body { position: relative; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="cap">3D 渲染 SOFT · three.js · 软材质 + 闭式物理</div>
<script type="module">
// ===== 3D 渲染（soft 风）· three.js r160 =====
// 契约：小球物理一次性从 0 重放预计算（fixed dt），__renderFrame(t) 只是查表+闭式相机/灯光，无逐帧累积。
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080, DUR = 12;
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rngFactory = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let z = Math.imul(seed ^ seed >>> 15, 1 | seed); z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z; return ((z ^ z >>> 14) >>> 0) / 4294967296; };

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
const BG_PINK = new THREE.Color('#F2A9CB'), BG_PURPLE = new THREE.Color('#C39AF0');
scene.background = BG_PINK.clone();
scene.fog = new THREE.Fog(scene.background, 16, 34);

const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);

// 柔和影棚环境反射
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

// ---- 灯光（粉色→紫色 随 t 迁移；白光压低让彩色 rim 主导氛围）----
scene.add(new THREE.HemisphereLight('#ffd9e9', '#a97fd8', 0.65));
const key = new THREE.DirectionalLight('#fff0f4', 0.9); key.position.set(3, 7, 5); scene.add(key);
const rimPink = new THREE.PointLight('#ff7fb2', 85, 0, 2); rimPink.position.set(-6, 3.5, 3); scene.add(rimPink);
const rimPurple = new THREE.PointLight('#9a5fff', 20, 0, 2); rimPurple.position.set(6, 3, 2.5); scene.add(rimPurple);

// ---- 软木塞针床 ----
const rng = rngFactory(42);
const PEG = { nx: 46, nz: 28, gap: 0.52, top: 0.42 };
{
  const geo = new THREE.CapsuleGeometry(0.13, 0.16, 4, 10);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0, envMapIntensity: 0.3 });
  const inst = new THREE.InstancedMesh(geo, mat, PEG.nx * PEG.nz);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  const palette = ['#ffffff', '#ffd9e8', '#e6d9ff', '#d5f2e7', '#fff1d6'];
  let i = 0;
  for (let ix = 0; ix < PEG.nx; ix++) for (let iz = 0; iz < PEG.nz; iz++) {
    const x = (ix - PEG.nx / 2 + 0.5) * PEG.gap, z = (iz - PEG.nz / 2 + 0.5) * PEG.gap;
    const sy = 0.85 + rng() * 0.45;
    m.makeScale(1, sy, 1); m.setPosition(x, 0.21 * sy, z);
    inst.setMatrixAt(i, m);
    inst.setColorAt(i, col.set(palette[Math.floor(rng() * palette.length)]));
    i++;
  }
  scene.add(inst);
}

// ---- 软糖文字 soft ----
const font = await new Promise((res, rej) => new FontLoader().load('./node_modules/three/examples/fonts/helvetiker_bold.typeface.json', res, undefined, rej));
{
  const geo = new TextGeometry('soft', {
    font, size: 2.3, height: 1.05, curveSegments: 14, // r160 参数名是 height，r163 才改叫 depth
    bevelEnabled: true, bevelThickness: 0.32, bevelSize: 0.26, bevelSegments: 10,
  });
  geo.center();
  const mat = new THREE.MeshPhysicalMaterial({
    color: '#fff6f0', roughness: 0.3, metalness: 0, envMapIntensity: 0.45,
    clearcoat: 1, clearcoatRoughness: 0.25, sheen: 1, sheenColor: new THREE.Color('#ff9ec8'),
  });
  const text = new THREE.Mesh(geo, mat);
  text.position.set(0, 2.02, 0); text.rotation.y = -0.12;
  scene.add(text);
}

// ---- 小球雨：从 0 重放预计算（fixed dt 采样成轨迹表）----
const BALL_N = 30, DT = 1 / 120, T_END = DUR + 0.6, SAMPLES = Math.ceil(T_END / DT);
const balls = [];
{
  const palette = ['#ff8fb8', '#c39bff', '#7fd8c8', '#ffd166', '#9ec5ff', '#ff6f91'];
  for (let i = 0; i < BALL_N; i++) {
    const r = 0.2 + rng() * 0.24;
    const front = rng() > 0.45;
    const z = front ? 1.6 + rng() * 3.2 : -1.4 - rng() * 3.4;
    const x = -8.5 + rng() * 17;
    const y0 = 7.5 + (i % 5) * 0.9, spawn = i * 0.22;
    const col = palette[Math.floor(rng() * palette.length)];
    balls.push({ r, x, z, y0, spawn, col, traj: new Float32Array(SAMPLES) });
  }
  // 闭式不算方便的反弹 → 一次性从 0 重放（确定性），采样成 f(t) 表
  for (const b of balls) {
    let y = b.y0, vy = 0;
    for (let s = 0; s < SAMPLES; s++) {
      const t = s * DT;
      if (t < b.spawn) { b.traj[s] = b.y0; continue; }
      vy -= 13 * DT; y += vy * DT;
      const ground = PEG.top + b.r;
      if (y < ground && vy < 0) {
        y = ground;
        vy = Math.abs(vy) > 1.1 ? Math.abs(vy) * 0.52 : 0;
      }
      b.traj[s] = y;
    }
  }
  const geoCache = new Map();
  for (const b of balls) {
    if (!geoCache.has(b.r)) geoCache.set(b.r, new THREE.SphereGeometry(b.r, 40, 28));
    const mat = new THREE.MeshPhysicalMaterial({
      color: b.col, roughness: 0.22, metalness: 0, envMapIntensity: 0.5,
      clearcoat: 0.8, clearcoatRoughness: 0.2, sheen: 0.6,
    });
    b.mesh = new THREE.Mesh(geoCache.get(b.r), mat);
    scene.add(b.mesh);
  }
}

// ---- 后期：轻微泛光 ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.35, 0.55, 0.82));
composer.addPass(new OutputPass());

const cap = document.getElementById('cap');
function render(t) {
  const k = clamp01(t / DUR);
  // 粉→紫迁移
  scene.background.lerpColors(BG_PINK, BG_PURPLE, k);
  scene.fog.color.copy(scene.background);
  rimPink.intensity = lerp(85, 25, k);
  rimPurple.intensity = lerp(20, 110, k);
  // 相机缓推
  camera.position.set(Math.sin(t * 0.16) * 1.6, 2.95 - t * 0.05, 9.9 - t * 0.08);
  camera.lookAt(0, 1.2, 0);
  // 小球查表
  for (let i = 0; i < BALL_N; i++) {
    const b = balls[i];
    const s = Math.min(SAMPLES - 1, Math.max(0, Math.floor(t / DT)));
    balls[i].mesh.position.set(balls[i].x, balls[i].traj[s], balls[i].z);
  }
  cap.style.opacity = clamp01((t - 0.5) / 0.6).toFixed(3);
  composer.render();
}

// ---- 契约入口 ----
window.__renderFrame = t => render(Math.min(DUR, Math.max(0, t)));
window.__DUR = DUR;
render(0); // 预热（着色器编译）
window.__READY = 1;
if (!location.search.includes('driven=1')) {
  const t0 = performance.now();
  (function loop() { render((performance.now() - t0) / 1000 % DUR); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
