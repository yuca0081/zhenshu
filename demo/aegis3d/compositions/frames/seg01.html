  <script src="assets/three.min.js"></script>
  <script>
    (function () {
      var TOTAL = 38;
      var st = { pulse: 1 };            // 年份切换的敲击脉冲（GSAP 驱动，确定性）
      var canvas, renderer, scene, camera, shield, dust;

      // ── 程序化 Aegis：盾体挤出 + 中央徽章 + 放射刺 + 铭牌 ──
      function shieldOutline(s) {
        var sh = new THREE.Shape();
        sh.moveTo(0, -1.35 * s);                                   // 底尖
        sh.bezierCurveTo(1.15 * s, -0.85 * s, 1.28 * s, 0.25 * s, 1.05 * s, 0.72 * s);
        sh.bezierCurveTo(0.85 * s, 1.10 * s, 0.42 * s, 1.22 * s, 0, 1.18 * s);
        sh.bezierCurveTo(-0.42 * s, 1.22 * s, -0.85 * s, 1.10 * s, -1.05 * s, 0.72 * s);
        sh.bezierCurveTo(-1.28 * s, 0.25 * s, -1.15 * s, -0.85 * s, 0, -1.35 * s);
        return sh;
      }
      function buildShield() {
        var g = new THREE.Group();
        var gold = new THREE.MeshStandardMaterial({ color: 0xC9A227, metalness: 0.78, roughness: 0.32 });
        var goldDark = new THREE.MeshStandardMaterial({ color: 0x8C6B12, metalness: 0.85, roughness: 0.4 });
        var goldLite = new THREE.MeshStandardMaterial({ color: 0xE8C766, metalness: 0.7, roughness: 0.26 });
        var body = new THREE.Mesh(new THREE.ExtrudeGeometry(shieldOutline(1.55),
          { depth: 0.34, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.09, bevelSegments: 3, curveSegments: 48 }), gold);
        body.position.z = -0.17;
        g.add(body);
        var inner = new THREE.Mesh(new THREE.ExtrudeGeometry(shieldOutline(1.26),
          { depth: 0.1, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 2, curveSegments: 48 }), goldDark);
        inner.position.z = 0.2;
        g.add(inner);
        var ring = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.075, 20, 60), goldLite);
        ring.position.z = 0.34;
        g.add(ring);
        for (var i = 0; i < 8; i++) {                                // 放射刺（固定角度，确定性）
          var spike = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.34, 12), goldLite);
          var a = i / 8 * Math.PI * 2;
          spike.position.set(Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0.38);
          spike.rotation.z = a - Math.PI / 2;
          g.add(spike);
        }
        var gem = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 24),
          new THREE.MeshStandardMaterial({ color: 0x3D6FB8, metalness: 0.4, roughness: 0.12 }));
        gem.position.z = 0.42;
        g.add(gem);
        return g;
      }
      function buildDust() {                                         // 金尘：LCG 伪随机布点（无 Math.random）
        var n = 140, pos = new Float32Array(n * 3), seed = 42;
        function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
        for (var i = 0; i < n; i++) {
          pos[i * 3] = (rnd() - 0.5) * 14;
          pos[i * 3 + 1] = (rnd() - 0.5) * 9;
          pos[i * 3 + 2] = (rnd() - 0.5) * 5 - 1;
        }
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xD8B04A, size: 0.045, transparent: true, opacity: 0.55 }));
      }
      function ensureGL() {
        if (renderer) return;
        canvas = document.getElementById('s-gl');
        renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(1920, 1080, false);
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 100);
        scene.add(new THREE.HemisphereLight(0x8899bb, 0x221a08, 0.55));
        var key = new THREE.DirectionalLight(0xfff1cf, 2.6); key.position.set(4, 6, 6); scene.add(key);
        var rim = new THREE.DirectionalLight(0x6f9fff, 1.6); rim.position.set(-6, 3, -6); scene.add(rim);
        var fill = new THREE.PointLight(0xffd27a, 1.1, 30); fill.position.set(-3, -2, 5); scene.add(fill);
        shield = buildShield(); scene.add(shield);
        dust = buildDust(); scene.add(dust);
      }
      function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
      function backOut(x) { var c = 1.70158; x = Math.min(Math.max(x, 0), 1); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
      function clamp01(x) { return Math.min(Math.max(x, 0), 1); }

      // ── 渲染帧：一切状态 = t 的纯函数（seek 到哪帧，渲染哪帧）──
      function renderFrame(t) {
        ensureGL();
        var appear = clamp01(t / 1.4);
        var intro = clamp01(t / 3.5);
        var yearin = easeOutCubic(clamp01((t - 3.5) / 1.2));       // 盾从中央滑到右主位
        var outp = clamp01((t - 33.4) / 2.2);
        var rotY, camX = 0, camY = 0.15, camZ, px = 0, py = -0.85, tiltX = 0, fl = 0.06 * Math.sin(t * 1.1);
        if (t < 3.5) {                                               // 出场：标题在上，盾从下方旋入
          rotY = -4.6 + 4.6 * easeOutCubic(intro);
          camZ = 9.4 - 1.6 * easeOutCubic(intro);
        } else if (t < 33.4) {                                       // 年份：盾居右主位，文字左列
          rotY = 0.55 * t;
          camZ = 6.2 - 0.7 * clamp01((t - 3.5) / 26);
          camX = 0.3 * Math.sin(t * 0.32);
          px = 2.15 * yearin;
          py = fl;
          tiltX = 0.05 * Math.sin(t * 0.21);
        } else {                                                     // 收尾：回正居中特写
          var base = 0.55 * 33.4;
          rotY = base - (base % (2 * Math.PI));
          rotY += (2 * Math.PI) * (1 - easeOutCubic(outp));
          px = 2.15 * (1 - easeOutCubic(outp));
          camZ = 5.6 - 0.5 * outp; camY = 0.15 + 0.25 * outp;
          py = fl; tiltX = -0.06 * outp;
        }
        var s = backOut(appear) * st.pulse;
        shield.scale.set(s, s, s);
        shield.rotation.y = rotY;
        shield.rotation.x = tiltX;
        shield.position.set(px, py, 0);
        dust.rotation.y = t * 0.03;
        dust.position.y = 0.15 * Math.sin(t * 0.4);
        camera.position.set(camX, camY, camZ);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }

      var tl = gsap.timeline({ paused: true });
      // 3D 帧驱动：hyperframes 对子时间轴的 seek 是 suppressEvents 的，
      // onUpdate 不触发；改挂 gsap.ticker（rAF 生命周期内、截图合成前必跑），
      // 渲染内容是 tl.time() 的纯函数，seek 到哪渲哪，确定性不破。
      renderFrame(0);
      gsap.ticker.add(function () { renderFrame(tl.time()); });
      // 标题/年份/结尾文本动效（绝对时刻，确定性）
      tl.from('#s-titlecard', { opacity: 0, y: 46, duration: 0.6, ease: 'power2.out' }, 0.15);
      tl.from('#s-subcard', { opacity: 0, y: 30, duration: 0.5, ease: 'power2.out' }, 0.45);
      tl.from('#s-rangecard', { opacity: 0, duration: 0.5, ease: 'none' }, 0.8);
      var yearStarts = [3.5, 5.8, 8.1, 10.4, 12.7, 15, 17.3, 19.6, 21.9, 24.2, 26.5, 28.8, 31.1];
      for (var i = 0; i < yearStarts.length; i++) {
        var t0 = yearStarts[i];
        tl.from('#s-y' + i, { opacity: 0, x: -60, duration: 0.35, ease: 'power2.out' }, t0 + 0.05);
        tl.from('#s-t' + i, { opacity: 0, duration: 0.35, ease: 'none' }, t0 + 0.2);
        tl.from('#s-n' + i, { opacity: 0, y: 34, duration: 0.35, ease: 'power2.out' }, t0 + 0.15);
        tl.from('#s-r' + i, { opacity: 0, y: 22, duration: 0.3, ease: 'power2.out' }, t0 + 0.3);
