@font-face{font-family:"Segoe UI";src:local("Segoe UI");}

#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;

.s-clip{position:absolute;inset:0;}
.s-desk{position:absolute;inset:0;background-color:#B0905C;background-image:

.s-scrap{position:absolute;box-shadow:6px 10px 18px rgba(50,30,8,.38);}
.s-news{background-color:#EFE6CF;color:#4A4438;padding:22px 24px;

.s-news h4{margin:0 0 8px 0;font-family:Georgia,serif;font-size:34px;font-weight:900;

.s-news p{margin:0;font-size:12px;line-height:1.75;text-align:justify;font-family:Georgia,'Microsoft YaHei',serif;}
.s-cols{column-count:2;column-gap:18px;column-rule:1px solid rgba(74,68,56,.35);}
.s-halftone{background-color:#E4D9BC;background-image:radial-gradient(rgba(38,34,27,.22) 1.1px,transparent 1.6px);

.s-tape{position:absolute;width:150px;height:36px;background:rgba(238,224,176,.8);

.s-ring{position:absolute;left:238px;top:158px;width:190px;height:190px;border-radius:50%;

.s-shape{position:absolute;filter:drop-shadow(4px 7px 8px rgba(50,30,8,.35));}
.s-ransom{position:absolute;top:636px;left:398px;width:900px;height:124px;}

.s-stamp i{display:block;font-style:normal;font-size:19px;font-weight:800;letter-spacing:6px;margin-top:2px;}
