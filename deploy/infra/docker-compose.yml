# 一台服务器多个个人项目的共享基础设施：PG + MinIO（+ 域名就绪后的 Caddy）。
# 全部只挂 infra 桥接网络，不向公网发布任何数据库/对象存储端口；
# 宿主机目录统一放 /opt/docker/ 下，备份脚本只盯这一个目录。
#
# 首次部署（服务器上）：
#   sudo mkdir -p /opt/docker/infra && cd /opt/docker/infra
#   # 放入本目录的 docker-compose.yml initdb/ 与 env.example（复制为 .env 并填值）
#   docker compose up -d
# 数据卷为空时 postgres 镜像自动执行 initdb/01-zhenshu.sh 建库建角色。
name: infra

networks:
  infra:
    name: infra

services:
  postgres:
    image: postgres:17
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 仅供 initdb/01-zhenshu.sh 首次建角色使用，之后可从 .env 删掉
      ZHENSHU_PG_PASSWORD: ${ZHENSHU_PG_PASSWORD}
    volumes:
      - /opt/docker/postgres/data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [infra]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # 日期式 tag 无法预知，先 latest 起；首次 pull 后 `docker images` 记下
    # RELEASE.20xx-xx-xx tag 回填钉死，避免将来 pull 到行为变更的版本
    image: minio/minio:latest
    container_name: infra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/docker/minio/data:/data
    # 管理台只听宿主机回环，用 SSH 隧道访问：ssh -L 9001:127.0.0.1:9001 <host>
    ports:
      - "127.0.0.1:9001:9001"
    networks: [infra]

  # 拥有域名后启用（DNS A 记录指到本机，80/443 在安全组+ufw 放行）：
  # 各项目 compose 的端口发布改为 127.0.0.1:8080:8080 只绑回环，公网统一走这里。
