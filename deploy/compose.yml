# 帧述 app 容器：加入共享 infra 网络直连 PG（服务名 postgres:5432）/MinIO（minio:9000），
# 不再用 host 网络——5432/9000 从此不出宿主机，安全组只需放行 22/80/443（过渡期 + 8080）。
# 有域名收进 Caddy 反代后，ports 改为 "127.0.0.1:8080:8080" 只绑回环。
services:
  app:
    build: .
    image: zhenshu-app:latest
    container_name: zhenshu-app
    networks: [infra]
    ports:
      - "8080:8080"
    env_file: /opt/zhenshu/.env
    volumes:
      - /opt/zhenshu/data/projects:/app/data/projects
      # 风格库/方法库/BGM（deploy.sh 随包同步，git 库的事实源；vendor/fonts 不在 git 但会随 tar 带上）
      - /opt/zhenshu/data/library:/app/data/library
      # 参考视频库（refs.json 索引+视频本体）：不挂卷则每次发版丢全部上传
      - /opt/zhenshu/data/references:/app/data/references
      # whisper 模型缓存（HF_HOME 指向这里）：不挂卷则每次重建容器重下 ~1.5GB
      - /opt/zhenshu/data/hf:/app/data/hf
    restart: unless-stopped
    # 渲染管线（逐帧截图+FFmpeg）吃 CPU/内存大户；同机还有别的项目时建议限上限，
    # 数值按机器内存自定（如 4g）。代价是渲染变慢，换来不挤垮邻居。
    # mem_limit: 4g
    # cpus: 3

networks:
  infra:
    external: true
    name: infra
